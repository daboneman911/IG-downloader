server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream downloads straight through instead of spooling them to nginx's disk/memory.
    proxy_buffering off;
    proxy_request_buffering off;
    # yt-dlp + an ffmpeg re-encode can take minutes before the first byte.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # The service worker and manifest must not be cached, or clients get stuck on an old shell.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri /index.html; }
}
