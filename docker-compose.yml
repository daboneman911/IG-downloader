# One command: `docker compose up --build`, then open http://localhost:8080
services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"            # nginx sits in front; rate limiting needs the real client IP
      YTDLP_UPDATE_HOURS: "24"
      MAX_CONCURRENT_JOBS: "3"
    tmpfs:
      - /tmp:size=4g              # job files are deleted after streaming; tmpfs keeps them off the image layer

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
