# fly launch --no-deploy --copy-config   (run inside /server), then: fly deploy
app = "grabdl-server"          # change to a unique name
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TRUST_PROXY = "1"
  YTDLP_UPDATE_HOURS = "24"
  # CORS_ORIGIN = "https://your-app.vercel.app"   # set via `fly secrets set` or here

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # Re-encoding needs some headroom; 1 GB / shared-cpu-2x is a sensible floor.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
